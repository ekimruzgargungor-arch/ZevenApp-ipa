name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project tree
        run: |
          ls -R .

      - name: CI diagnostic for signing
        run: |
          echo "Grep signing metadata"
          git grep -n "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY" || true

          echo "Show build settings"
          xcodebuild -project "App/WhatsApp Legacy.xcodeproj" -scheme "WhatsApp Legacy" -configuration Release -showBuildSettings | sed -n '1,200p' || true

          echo "List archive Info.plist if exists"
          if [ -d build/ZevenApp.xcarchive ]; then
            plutil -p build/ZevenApp.xcarchive/Info.plist || true
            grep -a "TeamIdentifier" -n build/ZevenApp.xcarchive -R || true
          else
            echo "No archive found yet"
          fi

      - name: Archive inspect and clean embedded provisioning
        run: |
          set -euo pipefail

          echo "Archive (unsigned flags)"
          xcodebuild \
            -project "App/WhatsApp Legacy.xcodeproj" \
            -scheme "WhatsApp Legacy" \
            -configuration Release \
            -archivePath build/ZevenApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive | tee xcode_archive.log

          echo "Remove embedded provisioning from all apps, extensions, frameworks (CI-only)"
          APP_DIRS=$(find build/ZevenApp.xcarchive -type d -name "*.app" 2>/dev/null || true)

          for APP in $APP_DIRS; do
            echo "Inspecting $APP"
            if [ -f "$APP/embedded.mobileprovision" ]; then
              echo "Removing $APP/embedded.mobileprovision"
              rm -f "$APP/embedded.mobileprovision" || true
            fi

            find "$APP" -type f -name "embedded.mobileprovision" -exec rm -f {} \; || true
          done

          echo "Verify no provisioning files remain"
          find build/ZevenApp.xcarchive -type f -name "embedded.mobileprovision" -print || echo "No embedded.mobileprovision files remain"

      - name: Remove all embedded provisioning and retry export (CI-only)
        run: |
          set -euo pipefail

          echo "List .mobileprovision files in archive (before removal):"
          find build/ZevenApp.xcarchive -type f -name "*.mobileprovision" -print || echo "No .mobileprovision files found (before)"

          echo "Removing all .mobileprovision files from archive (CI-only)"
          find build/ZevenApp.xcarchive -type f -name "*.mobileprovision" -exec rm -f {} \; || true

          echo "Verify removal (should print nothing):"
          find build/ZevenApp.xcarchive -type f -name "*.mobileprovision" -print || echo "No .mobileprovision files remain"

          echo "Retrying exportArchive"
          xcodebuild -exportArchive \
            -archivePath build/ZevenApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee xcode_export_retry.log || true

          echo "=== xcode_export_retry.log (first 400 lines) ==="
          sed -n '1,400p' xcode_export_retry.log || true

          echo "List exported IPA files (if any):"
          ls -la build/ipa || true

      - name: Export unsigned IPA
        run: |
          set -euo pipefail
          echo "Exporting archive to IPA (unsigned)"
          xcodebuild -exportArchive \
            -archivePath build/ZevenApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee xcode_export.log || true

          echo "List exported IPA files"
          ls -la build/ipa || true

      - name: Check for IPA
        id: check_ipa
        run: |
          if ls build/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload IPA Artifact
        if: ${{ steps.check_ipa.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZevenApp-Unsigned-IPA
          path: build/ipa/*.ipa
