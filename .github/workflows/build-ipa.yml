name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project tree
        run: |
          ls -R .

      - name: CI diagnostic for signing
        run: |
          echo "Grep signing metadata"
          git grep -n "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY" || true

          echo "Show build settings"
          xcodebuild -project "App/WhatsApp Legacy.xcodeproj" -scheme "WhatsApp Legacy" -configuration Release -showBuildSettings | sed -n '1,200p' || true

      - name: Archive (unsigned, armv7)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "App/WhatsApp Legacy.xcodeproj" \
            -scheme "WhatsApp Legacy" \
            -configuration Release \
            -archivePath build/ZevenApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="armv7 armv7s" \
            VALID_ARCHS="armv7 armv7s" \
            IPHONEOS_DEPLOYMENT_TARGET=9.0 \
            clean archive | tee xcode_archive.log

      - name: Clean embedded provisioning (CI-only)
        run: |
          set -euo pipefail
          APP_DIRS=$(find build/ZevenApp.xcarchive -type d -name "*.app" 2>/dev/null || true)
          for APP in $APP_DIRS; do
            echo "Inspecting $APP"
            find "$APP" -type f -name "embedded.mobileprovision" -exec rm -f {} \; || true
          done
          echo "Verify no embedded.mobileprovision files remain"
          find build/ZevenApp.xcarchive -type f -name "embedded.mobileprovision" -print || echo "None"

      - name: Package unsigned IPA from archive
        run: |
          set -euo pipefail
          mkdir -p build/ipa
          APP_PATH=$(ls -d build/ZevenApp.xcarchive/Products/Applications/*.app 2>/dev/null || true)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 0
          fi

          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/Payload"
          cp -R "$APP_PATH" "$TMPDIR/Payload/"
          find "$TMPDIR/Payload" -type f -name "embedded.mobileprovision" -exec rm -f {} \; || true

          IPA_NAME="ZevenApp-Unsigned-$(date +%Y%m%d%H%M%S).ipa"
          echo "Creating $IPA_NAME"

          # zip doğrudan build/ipa içine yazdırılıyor
          ( cd "$TMPDIR" && zip -r "$GITHUB_WORKSPACE/build/ipa/$IPA_NAME" Payload )

          rm -rf "$TMPDIR"
          echo "Unsigned IPA created at build/ipa/$IPA_NAME"
          ls -la build/ipa

      - name: Check for IPA
        id: check_ipa
        run: |
          if ls build/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload IPA Artifact
        if: ${{ steps.check_ipa.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZevenApp-Unsigned-IPA
          path: build/ipa/*.ipa
 
      - name: Show artifact download info
        if: ${{ steps.check_ipa.outputs.found == 'true' }}
        run: |
          echo "IPA uploaded as artifact: ZevenApp-Unsigned-IPA"
          echo "Download it from:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
