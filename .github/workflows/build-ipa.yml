name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project tree
        run: |
          ls -R .

      - name: CI diagnostic for signing
        run: |
          echo "Grep signing metadata"
          git grep -n "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY" || true

          echo "Show build settings"
          xcodebuild -project "App/WhatsApp Legacy.xcodeproj" -scheme "WhatsApp Legacy" -configuration Release -showBuildSettings | sed -n '1,200p' || true

          echo "List archive Info.plist if exists"
          if [ -d build/ZevenApp.xcarchive ]; then
            plutil -p build/ZevenApp.xcarchive/Info.plist || true
            grep -a "TeamIdentifier" -n build/ZevenApp.xcarchive -R || true
          else
            echo "No archive found yet"
          fi

      - name: Archive inspect and clean embedded provisioning
        run: |
          set -euo pipefail
          echo "Clean build dir"
          rm -rf build || true

          echo "Archive (unsigned flags)"
          xcodebuild \
            -project "App/WhatsApp Legacy.xcodeproj" \
            -scheme "WhatsApp Legacy" \
            -configuration Release \
            -archivePath build/ZevenApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive | tee xcode_archive.log

          echo "List archive contents"
          ls -la build/ZevenApp.xcarchive || true
          echo "Show Info.plist from archive"
          plutil -p build/ZevenApp.xcarchive/Info.plist || true

          echo "Check for embedded.mobileprovision inside app"
          APP_PATH=$(ls -d build/ZevenApp.xcarchive/Products/Applications/*.app 2>/dev/null || true)
          if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "embedded.mobileprovision FOUND at $APP_PATH/embedded.mobileprovision"
            echo "Dump TeamIdentifier from provisioning (if possible)"
            security cms -D -i "$APP_PATH/embedded.mobileprovision" > /tmp/prov.plist 2>/dev/null || true
            plutil -p /tmp/prov.plist | sed -n '1,200p' || true
            grep -a "TeamIdentifier" -n /tmp/prov.plist || true

            echo "Removing embedded.mobileprovision to avoid export requiring a Team"
            rm -f "$APP_PATH/embedded.mobileprovision" || true
            echo "Verify removal"
            ls -la "$APP_PATH" || true
          else
            echo "No embedded.mobileprovision found"
          fi

      - name: Export unsigned IPA
        run: |
          set -euo pipefail
          echo "Exporting archive to IPA (unsigned)"
          xcodebuild -exportArchive \
            -archivePath build/ZevenApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee xcode_export.log || true

          echo "List exported IPA files"
          ls -la build/ipa || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZevenApp-Unsigned-IPA
          path: build/ipa/*.ipa
